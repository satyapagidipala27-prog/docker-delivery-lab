
name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

  build-scan-push:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"

          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ steps.tags.outputs.sha_tag }}" \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        shell: bash
        run: |
          SHA_TAG="${{ steps.tags.outputs.sha_tag }}"

          docker push "$IMAGE_NAME:$SHA_TAG"

          if [ -n "${{ steps.tags.outputs.version_tag }}" ]; then
            VERSION_TAG="${{ steps.tags.outputs.version_tag }}"

            docker tag "$IMAGE_NAME:$SHA_TAG" "$IMAGE_NAME:$VERSION_TAG"
            docker tag "$IMAGE_NAME:$SHA_TAG" "$IMAGE_NAME:latest"

            docker push "$IMAGE_NAME:$VERSION_TAG"
            docker push "$IMAGE_NAME:latest"
          fi

      - name: Promote same image digest to staging
        shell: bash
        run: |
          SHA_TAG="${{ steps.tags.outputs.sha_tag }}"

          # Get the digest of the already-pushed commit image
          IMAGE_DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:$SHA_TAG" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo "Original image digest: $IMAGE_DIGEST"

          # Promote the existing manifest without creating an image index
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_NAME:staging" \
            "$IMAGE_NAME@$IMAGE_DIGEST"

          # Verify that staging points to the exact same digest
          STAGING_DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:staging" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo "Original digest: $IMAGE_DIGEST"
          echo "Staging digest:  $STAGING_DIGEST"

          if [ "$IMAGE_DIGEST" != "$STAGING_DIGEST" ]; then
            echo "ERROR: Image digest mismatch!"
            exit 1
          fi

          echo "SUCCESS: Staging points to the exact same image digest."
